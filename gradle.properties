group=dev.gounthar.xcpng.gateway
version=0.0.1

org.gradle.caching=true

# NOT enabled, deliberately, and this differs from the sibling toolbox project.
# The IntelliJ Platform Gradle plugin 2.x is not configuration-cache clean in every task
# (verifyPlugin and runIde in particular resolve state at execution time). Turning it on here
# produces a failure that names Gradle internals rather than the offending task, which costs
# more to read than the cache saves.
# org.gradle.configuration-cache=true

# LOAD BEARING. The IntelliJ Platform provides kotlin-stdlib at runtime, so the Kotlin Gradle
# plugin must not add it as an implementation dependency. Leaving this at the default bundles
# a second stdlib into the plugin zip and the platform then loads two, which surfaces at
# runtime as a NoSuchMethodError or a LinkageError inside the IDE rather than as a build
# failure.
#
# This is the same class of trap the toolbox sibling records for the Toolbox API, where the
# fix is compileOnly. Here the mechanism is a Kotlin plugin flag rather than a dependency
# scope, but the reasoning is identical: the host supplies it, so we compile against it and
# ship nothing.
kotlin.stdlib.default.dependency=false

# The platform bundles its own coroutines. Same reason as above.
kotlin.incremental.useClasspathSnapshot=true
